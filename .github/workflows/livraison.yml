# =========================================================================
# Contrôles, puis livraison de Biblio sur lisia.y-factor.fr
#
# CE QUE CHAQUE ÉTAGE PROUVE
#
#   Les contrôles montent une pile complète — PostgreSQL, schéma, API — et
#   lui envoient les vérifications de test-api.mjs. Ils attrapent une
#   régression de code ou de schéma avant qu'elle ne parte.
#
#   (Le nombre exact n'est plus écrit ici : il changeait à chaque ajout, et
#   un chiffre périmé dans un commentaire finit par être cru.)
#
#   La vérification d'après-déploiement rejoue LE MÊME test contre
#   l'instance installée. C'est le seul moment où l'on éprouve la
#   configuration réelle : variables d'environnement, base de production,
#   proxy inverse. Sur Adapsis, c'est cet étage-là qui a révélé qu'un champ
#   optionnel côté TypeScript était refusé à l'exécution.
#
# AUCUN APPEL PAYANT : test-api.mjs ne déclenche pas le modèle, il vérifie
# seulement que les routes qui coûtent sont protégées.
# =========================================================================

name: Livraison

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: biblio-${{ github.ref }}
  cancel-in-progress: false

jobs:

  controles:
    name: Contrôles
    runs-on: ubuntu-latest

    # PostgreSQL 17, comme en production. Une version différente ferait
    # passer en CI ce qui échouerait sur le serveur.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: biblio
          POSTGRES_PASSWORD: controle
          POSTGRES_DB: biblio
        options: >-
          --health-cmd "pg_isready -U biblio"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version: '22' }

      - name: Vérifier la syntaxe
        run: node --check api/server.js

      # TOUS LES FICHIERS, ET DANS L'ORDRE DES NOMS — comme le fait le script
      # de déploiement. Depuis le 15/08/2026 l'API exige le locataire par
      # défaut (02) et la vue « livres » (03) : sans eux elle refuse de
      # démarrer, ou tombe à la première requête. Ce refus est délibérément
      # bruyant — une API qui démarrerait sans cloisonnement servirait tout
      # à tout le monde.
      - name: Appliquer le schéma
        env: { PGPASSWORD: controle }
        run: |
          for f in db/*.sql; do
            echo "== ${f}"
            psql -h localhost -U biblio -d biblio -v ON_ERROR_STOP=1 -f "${f}"
          done

      # ==================================================================
      # UN COMPTE DANS LA BIBLIOTHEQUE PAR DEFAUT — 05/09/2026
      #
      # Depuis la migration 17, le statut de lecture et la note
      # appartiennent a une PERSONNE, plus a l'etagere : dans un cabinet
      # partage, marquer un ouvrage « Lu » le marquait pour tout le monde.
      #
      # La session par MOT DE PASSE ouvre la bibliotheque sans nommer
      # personne. Elle ne peut donc rien attribuer — sauf quand la
      # bibliotheque n'a QU'UN membre, auquel cas il n'y a rien a
      # departager. Sans ce compte, la base de controle serait une
      # bibliotheque a ZERO membre : un etat qui n'existe pas en
      # production, ou « creer_locataire » pose toujours un proprietaire.
      #
      # On repare donc le decor plutot que d'affaiblir la regle. Le compte
      # est cree APRES le schema, avant que l'API ne demarre.
      # ==================================================================
      - name: Donner un proprietaire a la bibliotheque de controle
        env: { PGPASSWORD: controle }
        run: |
          psql -h localhost -U biblio -d biblio -v ON_ERROR_STOP=1 -c "
            with c as (
              insert into comptes (courriel) values ('controle@exemple.fr')
              on conflict (courriel) do update set courriel = excluded.courriel
              returning id)
            insert into membres (compte_id, tenant_id, role)
            select c.id, t.id, 'proprietaire'
              from c, tenants t where t.identifiant = 'xavier'
            on conflict (compte_id, tenant_id) do nothing;"

      - name: Installer les dépendances de l API
        working-directory: api
        run: npm install --omit=dev --no-audit --no-fund

      - name: Démarrer l API
        working-directory: api
        env:
          PORT: '3000'
          PGHOST: localhost
          PGUSER: biblio
          PGPASSWORD: controle
          PGDATABASE: biblio
          MOT_DE_PASSE: mot-de-passe-de-controle
          # Persistant depuis le 15/08/2026 : un secret tire au hasard
          # deconnecterait tout le monde a chaque livraison.
          SECRET_SESSION: secret-de-controle-suffisamment-long-pour-passer
          # Pas de clef : les routes coûteuses doivent refuser proprement,
          # et c'est précisément ce que le test vérifie.
          ANTHROPIC_API_KEY: ''

          # Un jeu d'amorce SYNTHÉTIQUE — trois ouvrages Pro, deux Perso.
          #
          # La première version démarrait sur une base vide, et trois
          # vérifications échouaient : « les ouvrages perso apparaissent
          # une fois connecté », « le périmètre s'élargit — 0 vs 0 ».
          # Elles portent sur la frontière Pro/Perso, c'est-à-dire sur la
          # propriété de sécurité centrale de l'application. Les désactiver
          # pour faire passer la chaîne aurait retiré le test le plus
          # important ; on leur donne donc de quoi travailler.
          #
          # Ces cinq titres sont inventés. La vraie bibliothèque n'entre
          # jamais dans le dépôt : c'est précisément ce que le mot de passe
          # protège.
          FICHIER_AMORCE: ${{ github.workspace }}/tests/amorce-controle.json
        run: |
          node server.js &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/session >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/session || { echo "l API n a pas démarré"; exit 1; }

      - name: Vérifications de l API contre la pile locale
        env:
          BASE: http://localhost:3000
          MOT_DE_PASSE: mot-de-passe-de-controle
        run: node api/test-api.mjs

      - name: Test de fumée du front
        run: |
          npm install jsdom --no-audit --no-fund --silent
          node tests/test-fumee.js

      # La page publique a longtemps été la seule sans contrôle — c'est
      # précisément là que se trouvait une figure dont la géométrie était
      # tirée d'une formule pseudo-aléatoire, présentée comme une « vue
      # d'ensemble ». Ces vérifications portent sur la correspondance entre
      # les aires dessinées et les effectifs.
      - name: La page d accueil dit ce qu elle montre
        run: node tests/test-accueil.js

      # ==================================================================
      # LES CONTROLES DE CLOISONNEMENT, TOUS SUR UN VRAI POSTGRESQL
      #
      # Ils tournaient sur PGlite (PostgreSQL en WebAssembly) jusqu'au
      # 15/08/2026. Deux defauts l'ont disqualifie :
      #
      #   — son unique role est superutilisateur, et un superutilisateur
      #     traverse toutes les politiques EN SILENCE. Deux fichiers sont
      #     passes au vert en montrant a chacun la bibliotheque de tous.
      #   — il n'a qu'UNE session : l'observateur et l'observe la partagent,
      #     et le controle finit par mesurer sa propre cecite.
      #
      # DEUX COMPTES, et c'est le point :
      #   biblio_app  celui de l'API. Proprietaire des tables, NI
      #               superutilisateur NI BYPASSRLS. Le compte « biblio » du
      #               service Docker est superutilisateur : s'en servir
      #               ferait passer cet etage au vert quoi qu'il arrive.
      #   biblio      l'observateur. Il doit voir ce que la base contient
      #               REELLEMENT, sinon il ne distingue pas « la ligne a ete
      #               protegee » de « je ne la vois pas ».
      #
      # Une base par fichier : chacun cree ses propres locataires, et deux
      # jeux de donnees dans la meme base se marcheraient dessus.
      # ==================================================================
      - name: Preparer les comptes et les bases de controle
        env: { PGPASSWORD: controle }
        run: |
          psql -h localhost -U biblio -d biblio -v ON_ERROR_STOP=1 -c \
            "create role biblio_app login password 'controle' nosuperuser nobypassrls;"

          # LA LISTE DES BASES A DISPARU — 25/08/2026.
          #
          # Elle etait ecrite ici, a la main, et il fallait penser a l'allonger
          # en meme temps qu'on ajoutait un « lancer ». C'etait la SEPTIEME
          # liste manuelle de ce depot, et elle a coute la livraison #64 :
          # test-suppression.mjs ajoute la veille, base « biblio_supp »
          # oubliee, chaine rouge apres cinq minutes de controles verts.
          #
          # Chaque « lancer » cree desormais SA base. Il n'y a plus de liste a
          # tenir a jour, donc plus rien a oublier. Une structure qui rend la
          # faute impossible vaut mieux qu'un controle qui la signale.

      - name: Cloisonnement, visibilite, catalogue, contexte, reglages, durcissement
        env: { PGPASSWORD: controle }
        run: |
          # jsdom : test-bascule.mjs execute la vraie page pour verifier que
          # le selecteur de bibliotheque apparait quand il y a un choix, et
          # SEULEMENT alors. Une verification par expression reguliere sur le
          # HTML dirait que le bloc existe, pas qu'il finit visible.
          npm install pg fast-xml-parser jsdom --no-audit --no-fund --silent
          # Une base par fichier : chacun cree ses propres locataires, et deux
          # jeux de donnees dans la meme base se marcheraient dessus. Elle est
          # creee ICI, au moment de s'en servir — c'est ce qui supprime la
          # liste qu'il fallait tenir a jour ailleurs.
          lancer () {
            echo "== $2"
            psql -h localhost -U biblio -d biblio -v ON_ERROR_STOP=1 -q -c \
              "create database biblio_$1 owner biblio_app;"
            PGURL=postgres://biblio_app:controle@localhost:5432/biblio_$1 \
            PGURL_OEIL=postgres://biblio:controle@localhost:5432/biblio_$1 \
              node tests/$2
          }
          lancer rejeu test-rejeu.mjs
          lancer clois test-cloisonnement.mjs
          lancer ctx   test-contexte.mjs
          lancer cat   test-catalogue.mjs
          lancer rls   test-http-cloisonnement.mjs
          lancer lang  test-resumes-langues.mjs
          lancer regl  test-reglages.mjs
          lancer durc  test-durcissement.mjs
          lancer lien  test-lien-magique.mjs
          lancer usag  test-usage-ia.mjs
          lancer bibl  test-bibliographie.mjs
          lancer supp  test-suppression.mjs
          lancer basc  test-bascule.mjs
          lancer invit test-invitation.mjs
          lancer lect  test-lectures.mjs
          lancer repr  test-reprise-lectures.mjs
          lancer empo  test-emporter.mjs
          lancer sieg  test-sieges.mjs
          lancer rsie  test-reprise-sieges.mjs

      # ------------------------------------------------------------------
      # AUTHENTIFICATION PAR LIEN MAGIQUE
      #
      # Six des sept mutations essayees le 15/08/2026 sont attrapees. La
      # septieme — remplacer timingSafeEqual par une comparaison ordinaire —
      # n'en fait tomber aucune, et ne le peut pas : une attaque temporelle
      # ne se voit pas dans un test de justesse. C'est ecrit en tete du
      # fichier de test plutot que masque.
      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # LE CONTROLE QUI VERIFIE LES CONTROLES
      #
      # Trois listes manuelles ont mordu dans ce depot : celle du deployeur
      # (16/08), celle de test-authentification.mjs (21/08), et la mienne —
      # douze suites lancees sur quinze, annoncees « douze suites vertes ».
      #
      # Une liste manuelle ne signale jamais ce qui lui manque : elle passe au
      # vert sur ce qu'elle contient, et son silence sur le reste ressemble a
      # un succes. Celui-ci compare le repertoire au workflow, dans les deux
      # sens, et refuse un fichier d'essai que personne ne lance.
      #
      # EN PREMIER, avant les suites elles-memes : savoir qu'il en manque une
      # est plus urgent que le resultat de celles qui tournent.
      # ------------------------------------------------------------------
      - name: Chaque fichier d essai est bien lance
        run: node tests/test-couverture.mjs

      # Un seul domaine, declare une seule fois. Il etait ecrit en toutes
      # lettres dans douze fichiers ; le vingtieme oubli aurait ete celui qui
      # casse les liens magiques.
      - name: Un seul domaine, declare une seule fois
        run: node tests/test-domaine.mjs

      # Google en OIDC. Aucun accès réseau : un faux fournisseur d'identité
      # local, avec sa propre paire de clés, permet de fabriquer les jetons
      # qu'un attaquant fabriquerait — ce qu'on ne peut pas demander à Google.
      - name: Google en OIDC, chaque verification retiree une a une
        run: node tests/test-oidc.mjs

      # Une seule porte par ou nait une bibliotheque. Le 24/08/2026,
      # INSCRIPTION_OUVERTE ne gouvernait que le lien magique : Google creait
      # des comptes avec le drapeau a 0. Aucune suite ne pouvait le voir,
      # toutes lancaient leurs serveurs avec le drapeau a 1.
      - name: Une seule porte, et elle demande le drapeau
        run: node tests/test-portes-inscription.mjs

      # Les pages legales disent-elles ce que le code fait ? Une politique
      # perimee est PIRE que pas de politique : elle promet. Ce controle
      # refuse la livraison si un tiers appele par le code n'y est pas
      # declare — il a attrape Resend le jour meme ou il a ete ecrit.
      - name: Les pages legales disent ce que le code fait
        run: node tests/test-pages-legales.mjs

      # Une couleur ne s'ecrit qu'a un endroit. La regle est conditionnelle —
      # une page qui charge jetons.css n'en definit plus — pour que la
      # migration se fasse page par page sans laisser le controle rouge.
      # Verifie aussi que les polices sont chez nous et non chez Google : les
      # y appeler donnerait a Google l'IP de chaque visiteur, ce que la
      # politique de confidentialite affirme ne pas faire.
      - name: Une couleur ne s'ecrit qu'a un endroit
        run: node tests/test-jetons.mjs

      # Deux bornes justes separement dont la conjonction ment : le quota
      # annoncait dix appels, le plafond d'argent fermait au sixieme. Vu le
      # 31/08 en ecrivant la page d'accueil, pas par un controle.
      - name: Les deux plafonds ne se contredisent pas
        run: node tests/test-plafonds-coherents.mjs

      - name: Authentification par lien magique
        run: |
          npm install @electric-sql/pglite --no-audit --no-fund --silent
          node tests/test-authentification.mjs

      # ------------------------------------------------------------------
      # LA RECETTE SE VOIT, LA PRODUCTION NE SE DEGUISE PAS
      #
      # Le bandeau n'est pas un ornement : c'est ce qui empeche d'effacer
      # des donnees en croyant etre ailleurs. Eprouve DANS LES DEUX SENS —
      # absent en recette il ne previent personne, present en production il
      # devient un decor qu'on cesse de lire.
      # ------------------------------------------------------------------
      - name: L environnement s annonce
        env: { PGPASSWORD: controle }
        run: |
          psql -h localhost -U biblio -d biblio -v ON_ERROR_STOP=1 -c \
            "create database biblio_env owner biblio_app;"
          PGURL=postgres://biblio_app:controle@localhost:5432/biblio_env \
          PGURL_OEIL=postgres://biblio:controle@localhost:5432/biblio_env \
            node tests/test-environnement.mjs

      - name: Fabriquer le paquet
        run: |
          tar czf paquet.tar.gz --exclude=node_modules api web db deploiement
          echo "poids : $(du -h paquet.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with: { name: paquet, path: paquet.tar.gz, retention-days: 7 }

  # ==========================================================================
  # LA RECETTE D'ABORD.
  #
  # C'est le seul endroit ou les migrations rencontrent une COPIE DE VOS
  # DONNEES avant la production : pas trois cent vingt et un titres inventes,
  # mais les vrais, avec leurs accents, leurs editeurs vides et leurs trois
  # ASIN deguises en ISBN.
  #
  # « needs: recette » sur le travail suivant fait le reste : si la recette
  # tombe, la production n'est jamais atteinte.
  # ==========================================================================
  recette:
    name: Recette
    needs: controles
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with: { name: paquet }

      - name: Préparer l accès SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.CLE_DEPLOIEMENT_BIBLIO }}" > ~/.ssh/cle
          chmod 600 ~/.ssh/cle
          printf '%s\n' "${{ secrets.EMPREINTE_HOTE }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Déployer en recette
        run: |
          ssh -i ~/.ssh/cle \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              root@${{ secrets.HOTE_VPS }} "deployer biblio-recette" < paquet.tar.gz

      # La recette est fermee par un mot de passe HTTP : sans lui, ce
      # controle recevrait un 401 et conclurait que le service est mort.
      - name: La recette repond, et se declare comme telle
        env:
          AUTH: ${{ secrets.AUTH_RECETTE_BIBLIO }}
        timeout-minutes: 5
        run: |
          base=https://biblio-recette.xavier-holingue.eu

          # LE SECRET D'ABORD, ET ON LE DIT.
          #
          # Sans cette verification, curl recevait « -u "" », restait sur
          # « Enter host password for user '' » et rendait un 401. Le journal
          # affichait donc « page : 401 » — un code qui laisse croire a un
          # probleme de serveur alors qu'il manque un secret dans GitHub.
          #
          # Un message qui n'explique pas coute un aller-retour ; celui-la en
          # a coute un le 15/08/2026.
          case "${AUTH}" in
            "")  echo "  ECHEC secret AUTH_RECETTE_BIBLIO absent."
                 echo "        Settings > Secrets and variables > Actions"
                 echo "        valeur attendue : recette:<mot de passe HTTP>"
                 exit 1 ;;
            *:*) ;;
            *)   echo "  ECHEC AUTH_RECETTE_BIBLIO mal forme : il manque « : »"
                 echo "        valeur attendue : recette:<mot de passe HTTP>"
                 exit 1 ;;
          esac

          # « -f » sur l'invite : curl ne doit jamais attendre une saisie dans
          # une chaine automatisee, sinon l'etape expire sans rien dire.
          code=$(curl -s -o /dev/null -w '%{http_code}' --no-progress-meter \
                   -u "${AUTH}" --max-time 25 "${base}/" </dev/null)
          echo "  page : ${code}"
          case "${code}" in
            200) ;;
            401) echo "  ECHEC 401 : le mot de passe HTTP ne correspond pas."
                 echo "        le refaire : vps-installer-recette-biblio.sh --refaire-le-mot-de-passe-http"
                 exit 1 ;;
            000) echo "  ECHEC 000 : pas de reponse — certificat TLS en cours d'emission ?"
                 echo "        c'est souvent transitoire, relancer la livraison"
                 exit 1 ;;
            *)   echo "  ECHEC code inattendu"; exit 1 ;;
          esac

          # LE CONTROLE QUI COMPTE ICI. Une recette qui se declare
          # « production » serait pire qu'absente : on s'y croirait en
          # securite pour y faire des betises.
          env=$(curl -s -u "${AUTH}" --max-time 25 "${base}/api/session" \
                | grep -o '"environnement":"[a-z]*"' | cut -d'"' -f4)
          echo "  environnement annonce : ${env}"
          [ "${env}" = "recette" ] || {
            echo "  ECHEC la recette ne se declare pas comme telle"; exit 1; }

          # Et elle ne doit pas etre indexable.
          curl -sI -u "${AUTH}" --max-time 25 "${base}/" \
            | grep -qi '^x-robots-tag:.*noindex' \
            || { echo "  ECHEC la recette est indexable"; exit 1; }
          echo "  noindex present"

  production:
    name: Production
    needs: recette
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with: { name: paquet }

      - name: Préparer l accès SSH
        run: |
          install -d -m 700 ~/.ssh
          # Clef bridée par command= : elle ne peut lancer que le
          # déploiement de Biblio, rien d autre sur ce serveur.
          printf '%s\n' "${{ secrets.CLE_DEPLOIEMENT_BIBLIO }}" > ~/.ssh/cle
          chmod 600 ~/.ssh/cle
          printf '%s\n' "${{ secrets.EMPREINTE_HOTE }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Déployer
        run: |
          ssh -i ~/.ssh/cle \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              root@${{ secrets.HOTE_VPS }} "deployer biblio" < paquet.tar.gz

      # La production, elle, ne doit SURTOUT PAS se declarer en recette.
      - name: La production ne se deguise pas
        run: |
          env=$(curl -s --max-time 25 https://lisia.y-factor.fr/api/session \
                | grep -o '"environnement":"[a-z]*"' | cut -d'"' -f4)
          echo "  environnement annonce : ${env:-absent}"
          [ "${env}" != "recette" ] || {
            echo "  ECHEC la production se declare en recette"; exit 1; }

      # LE contrôle qui compte : le même test, contre l instance réelle.
      - name: Vérifications de l API contre l instance déployée
        env:
          BASE: https://lisia.y-factor.fr
          MOT_DE_PASSE: ${{ secrets.MOT_DE_PASSE_BIBLIO }}
        timeout-minutes: 10
        run: node api/test-api.mjs

      - name: La page répond
        run: |
          c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://lisia.y-factor.fr)
          printf '  lisia.y-factor.fr : %s\n' "${c}"
          [ "${c}" = "200" ] || exit 1

      # ------------------------------------------------------------------
      # UN VRAI NAVIGATEUR SUR LA PAGE RÉELLE
      #
      # Les étages précédents ne peuvent pas voir certaines pannes. jsdom
      # n'applique ni feuille de style, ni mise en page, ni politique de
      # sécurité du contenu : il exécute le script quoi qu'il arrive.
      #
      # Le 04/08/2026, la page publique est restée des heures sur
      # « Chargement des statistiques… » parce que la CSP servie par Caddy
      # interdisait les scripts en ligne. Tous les contrôles passaient.
      # Le défaut a été trouvé à l'œil, en regardant la page.
      #
      # Cet étage regarde la page à notre place, dans Chromium, sur écran
      # de bureau et sur mobile.
      # ------------------------------------------------------------------
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with: { node-version: '22' }

      # ------------------------------------------------------------------
      # UNE ETAPE SANS BORNE A FAIT PASSER UNE PRODUCTION SAINE POUR UN
      # ECHEC — 18/08/2026.
      #
      # Toutes les autres etapes portaient un timeout ; celle-ci, non. Les
      # miroirs Ubuntu du runner (azure.archive.ubuntu.com) sont tombes,
      # « apt » a reessaye pendant dix-neuf minutes, et la livraison a ete
      # annulee a la main. La production, elle, etait deployee depuis le
      # debut : les quatre etapes qui comptent etaient vertes.
      #
      # DEUX CORRECTIFS, ET LE SECOND EST LE VRAI.
      #
      # « --with-deps » est retire : il reinstalle des paquets systeme a
      # CHAQUE livraison, donc depend d'apt, donc de miroirs qu'on ne
      # choisit pas. Les runners GitHub embarquent deja Chromium et ses
      # bibliotheques ; ce qui n'est pas demande ne peut pas tomber.
      #
      # Le timeout reste, parce qu'il protege d'autre chose : le
      # telechargement du navigateur lui-meme peut trainer. Cinq minutes
      # suffisent largement, et un depassement dit franchement « le reseau
      # n'a pas suivi » au lieu d'attendre le plafond de six heures.
      #
      # Portee de cet echec, pour memoire : ce travail s'execute APRES le
      # deploiement. Il constate, il ne protege pas. Le vrai garde-fou est
      # la recette qui conditionne la production, et elle avait tenu.
      # ------------------------------------------------------------------
      - name: Installer Playwright
        timeout-minutes: 5
        run: |
          npm install @playwright/test --no-audit --no-fund
          npx playwright install chromium

      - name: Parcours en navigateur réel
        env:
          BASE: https://lisia.y-factor.fr
          # Le formulaire d'ajout n'existe que pour une session ouverte :
          # sans mot de passe, la vérification d'affichage du bouton
          # « Scanner » est ignorée plutôt que faussement réussie.
          MOT_DE_PASSE: ${{ secrets.MOT_DE_PASSE_BIBLIO }}
        timeout-minutes: 10
        run: npx playwright test --config tests/playwright.config.mjs

      # En cas d'échec, la capture d'écran et la trace disent ce que le
      # navigateur voyait — bien plus utile qu'un message d'assertion.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: failure()
        with:
          name: playwright-preuves
          path: |
            playwright-report/
            test-results/
          retention-days: 7
