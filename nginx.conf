server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité. La politique de contenu autorise uniquement
    # les couvertures d'Open Library et de Google Books.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://covers.openlibrary.org https://books.google.com https://*.googleusercontent.com; connect-src 'self' https://www.googleapis.com; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # La génération d'un résumé prend une quinzaine de secondes,
        # une recommandation peut aller au-delà.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Les tests et les éventuels node_modules n'ont rien à faire en ligne.
    location ~ ^/(test|node_modules)/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        # L'application évolue : on ne veut pas d'une version figée en cache.
        add_header Cache-Control "no-cache" always;
    }
}
