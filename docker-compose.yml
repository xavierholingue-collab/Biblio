name: biblio

services:
  db:
    # POSTGRESQL 18 DEPUIS LE 06/09/2026, comme la production.
    #
    # La bascule 15.19 -> 18.6 a été faite sur le serveur par
    # « pg_upgradecluster --method=dump » : vidage et rechargement complets,
    # 27 secondes, applications arrêtées de 14 h 26 à 14 h 31. Même hôte,
    # même port, mêmes rôles, mêmes noms de bases — rien à changer dans le
    # code. Les trois bases ont été confrontées avant/après : 19 tables et
    # 38 politiques RLS de part et d'autre.
    #
    # LE TRI ALPHABÉTIQUE A ÉTÉ MESURÉ, PAS SUPPOSÉ. C'est le vrai risque
    # d'une montée de version majeure : glibc change ses règles de collation,
    # et l'ordre des accents bouge sans rien casser d'autre. L'empreinte
    # « md5(string_agg(titre order by titre)) » sur les 324 lignes réelles de
    # « books » a été comparée entre les deux versions de glibc — identique.
    # La collation reste « fr_FR.UTF-8 ».
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-biblio}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD manquant dans .env}
      POSTGRES_DB: ${PGDATABASE:-biblio}
      # Locale française pour que le tri alphabétique respecte les accents.
      # Reste valable tel quel en 18.
      POSTGRES_INITDB_ARGS: "--locale=fr_FR.UTF-8 --encoding=UTF8"
      LANG: fr_FR.utf8
    volumes:
      # LE POINT DE MONTAGE A CHANGÉ AVEC L'IMAGE 18, et il faut le savoir
      # avant de chercher pourquoi la base semble vide.
      #
      # L'image « postgres:18 » a déplacé son répertoire de données :
      # « PGDATA » vaut désormais /var/lib/postgresql/18/docker, et c'est
      # /var/lib/postgresql qu'il faut monter. Au premier « docker compose
      # up », la 18 crée donc une base NEUVE et les scripts de ./db se
      # rejouent ; les anciennes données de la 15 restent dans « pgdata/data »
      # sans servir.
      #
      # Pour repartir propre : « docker compose down -v » puis « up ».
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    # La base n'est pas exposée à l'extérieur : seule l'API y accède.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-biblio} -d ${PGDATABASE:-biblio}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${PGUSER:-biblio}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-biblio}
      MOT_DE_PASSE: ${MOT_DE_PASSE:?MOT_DE_PASSE manquant dans .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODELE: ${MODELE:-claude-sonnet-5}
    volumes:
      - ./seed:/seed:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Écoute uniquement sur cette machine, pas sur le réseau local.
      - "127.0.0.1:${PORT_WEB:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
